<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign in | Krisin Clothing</title>
<link rel="icon" href="../assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body class="a-login-body">

<div class="a-login-card">
  <img src="../assets/logo-horizontal.png" alt="Krisin Clothing">
  <h1>Admin sign in</h1>
  <p class="sub">Store management is restricted to Krisin staff. Sign in to continue.</p>

  <div class="a-login-error" id="login-error">That email or password isn't right. Try again.</div>

  <form id="login-form">
    <div class="a-field">
      <label for="li-email">Email</label>
      <input type="email" id="li-email" autocomplete="username" value="admin@krisin.clothing" required>
    </div>
    <div class="a-field">
      <label for="li-pass">Password</label>
      <input type="password" id="li-pass" autocomplete="current-password" value="krisin@admin1" required>
    </div>
    <button type="submit" id="btn-submit" class="a-btn primary">Sign in</button>
  </form>

  <div class="a-login-hint" id="login-hint">
    <strong>Admin Access:</strong> Authenticates securely against Neon PostgreSQL.<br>
    Default credentials: <strong>admin@krisin.clothing</strong> / <strong>krisin@admin1</strong>.
    <div id="backend-status-pill" style="margin-top:8px;font-size:12px;color:var(--gold-text)">Checking backend server status...</div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
const DEMO_EMAIL = "admin@krisin.clothing";
const DEMO_PASS = "krisin@admin1";

// If already signed in, skip straight to the dashboard.
if (sessionStorage.getItem("krisin_admin_session") === "1") {
  window.location.href = "dashboard.html";
}

// Check backend status on page load
const statusEl = document.getElementById("backend-status-pill");
KrisinAPI.checkHealth().then(health => {
  if (health.online && health.database && health.database.connected) {
    statusEl.innerHTML = `<span style="color:#22c55e">●</span> Connected to Neon PostgreSQL (live)`;
  } else if (health.online) {
    statusEl.innerHTML = `<span style="color:#eab308">●</span> Backend online, Neon DB not initialized yet`;
  } else {
    statusEl.innerHTML = `<span style="color:#94a3b8">●</span> Backend offline (local demo mode)`;
  }
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("li-email").value.trim().toLowerCase();
  const pass = document.getElementById("li-pass").value;
  const errBox = document.getElementById("login-error");
  const submitBtn = document.getElementById("btn-submit");

  errBox.classList.remove("show");
  submitBtn.disabled = true;
  submitBtn.textContent = "Verifying...";

  try {
    // Attempt authentication with Neon PostgreSQL backend
    const res = await KrisinAPI.adminLogin(email, pass);
    sessionStorage.setItem("krisin_admin_session", "1");
    sessionStorage.setItem("krisin_admin_email", res.admin ? res.admin.email : email);
    sessionStorage.setItem("krisin_admin_name", res.admin ? res.admin.name : "Admin");
    window.location.href = "dashboard.html";
  } catch (backendErr) {
    console.warn("Backend login failed or unreachable:", backendErr.message);

    // Fallback: If backend is unreachable, check demo credentials
    if (email === DEMO_EMAIL && pass === DEMO_PASS) {
      sessionStorage.setItem("krisin_admin_session", "1");
      sessionStorage.setItem("krisin_admin_email", email);
      sessionStorage.setItem("krisin_admin_name", "Krisin Admin (Demo)");
      window.location.href = "dashboard.html";
    } else {
      errBox.textContent = backendErr.message || "That email or password isn't right. Try again.";
      errBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    }
  }
});
</script>
</body>
</html>
