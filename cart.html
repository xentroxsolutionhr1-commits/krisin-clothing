<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bag | Krisin Clothing</title>
  <link rel="icon" href="assets/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <button class="menu-toggle icon-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24">
          <path d="M3 6h18M3 12h18M3 18h18" />
        </svg>
      </button>
      <a href="index.html" class="brand"><img src="assets/logo-horizontal.png" alt="Krisin Clothing"></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="new-arrivals.html">New Arrivals</a>
        <a href="collections.html">Collections</a>
        <a href="about.html">About Us</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-search-toggle aria-label="Search">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
        </button>
        <div class="search-bar"><input type="text" placeholder="Search products…"></div>
        <a href="login.html" class="icon-btn" aria-label="Account">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6" />
          </svg>
        </a>
        <a href="shop.html?filter=wishlist" class="icon-btn" aria-label="Wishlist">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s-7.5-4.6-10-9.2C.4 8.4 2 4.5 6 4c2.4-.3 4.2 1 6 3 1.8-2 3.6-3.3 6-3 4 .5 5.6 4.4 4 7.8C19.5 16.4 12 21 12 21z" />
          </svg>
          <span class="count-badge hidden" data-wish-count>0</span>
        </a>
        <button class="icon-btn" data-cart-open aria-label="Cart">
          <svg viewBox="0 0 24 24">
            <path d="M6 8h12l-1 12H7L6 8z" />
            <path d="M9 8V6a3 3 0 016 0v2" />
          </svg>
          <span class="count-badge hidden" data-cart-count>0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav">
    <div class="mobile-nav-top">
      <a href="index.html" class="brand"><img src="assets/logo-horizontal.png" alt="Krisin Clothing"></a>
      <button class="icon-btn mobile-nav-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
    <nav class="mobile-nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="new-arrivals.html">New Arrivals</a>
      <a href="collections.html">Collections</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <div class="drawer-overlay" data-cart-close></div>
  <aside class="cart-drawer">
    <div class="drawer-head">
      <span class="heading" style="font-size:18px">Your Bag</span>
      <button class="icon-btn" data-cart-close aria-label="Close"><svg viewBox="0 0 24 24">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg></button>
    </div>
    <div class="drawer-body"></div>
    <div class="drawer-foot">
      <div class="summary-line total"><span>Subtotal</span><span data-drawer-total>₹0</span></div>
      <a href="cart.html" class="btn btn-outline btn-block" style="margin-top:12px">View Bag</a>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:10px" data-checkout-btn>Checkout</a>
    </div>
  </aside>

  <main class="container">
    <div class="page-hero" style="padding-top:40px">
      <h1 class="heading">Your Bag</h1>
    </div>

    <div id="cart-content"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0">
        <span>© 2026 Krisin Clothing</span>
      </div>
    </div>
  </footer>

  <script src="js/data.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
  <script>
    (function () {
      const content = document.getElementById("cart-content");

      function render() {
        const cart = STORE.getCart();
        if (cart.length === 0) {
          content.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" stroke-width="1.2" fill="none" stroke="currentColor"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
          <p class="sub" style="margin:0 auto 22px">Your bag is empty. Let's fix that.</p>
          <a href="shop.html" class="btn btn-primary">Continue shopping</a>
        </div>`;
          return;
        }

        const subtotal = STORE.cartTotal();
        const shipping = subtotal >= 1999 ? 0 : 99;
        const total = subtotal + shipping;

        const rows = cart.map((item, i) => {
          const p = getProduct(item.productId);
          if (!p) return "";
          return `
      <div class="cart-row">
        <img src="${p.images[0]}" alt="${p.name}">
        <div>
          <div class="name">${p.name}</div>
          <div class="meta">${item.color}, size ${item.size}</div>
          <div class="qty-row" style="margin-top:8px">
            <button data-dec="${i}">−</button>
            <span>${item.qty}</span>
            <button data-inc="${i}">+</button>
          </div>
          <button class="cart-remove" data-remove="${i}">Remove</button>
        </div>
        <div class="price mono-price">${formatPrice(p.price * item.qty)}</div>
      </div>`;
        }).join("");

        content.innerHTML = `
      <div class="cart-layout">
        <div>${rows}</div>
        <div class="summary-box">
          <h3>Order Summary</h3>
          <div class="summary-line"><span>Subtotal</span><span class="mono-price">${formatPrice(subtotal)}</span></div>
          <div class="summary-line"><span>Shipping</span><span class="mono-price">${shipping === 0 ? "Free" : formatPrice(shipping)}</span></div>
          <div class="promo-row">
            <input type="text" placeholder="Discount code">
            <button class="btn btn-ghost btn-sm">Apply</button>
          </div>
          <div class="summary-line total"><span>Total</span><span class="mono-price">${formatPrice(total)}</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:20px" data-checkout-btn>Checkout</a>
          <a href="shop.html" class="link-underline" style="display:block;text-align:center;margin-top:16px">Continue Shopping</a>
        </div>
      </div>`;

        content.querySelectorAll("[data-inc]").forEach(b => b.addEventListener("click", () => {
          const i = +b.dataset.inc; STORE.setQty(i, STORE.getCart()[i].qty + 1); render();
        }));
        content.querySelectorAll("[data-dec]").forEach(b => b.addEventListener("click", () => {
          const i = +b.dataset.dec; const c = STORE.getCart()[i]; if (c.qty > 1) STORE.setQty(i, c.qty - 1); render();
        }));
        content.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
          STORE.removeFromCart(+b.dataset.remove); render();
        }));
      }

      render();
      // Update checkout buttons based on login state after rendering
      if (typeof updateCheckoutButtons === 'function') updateCheckoutButtons();
    })();
  </script>
  <script src="js/animations.js"></script>
</body>

</html>
